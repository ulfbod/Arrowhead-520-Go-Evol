resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # NOTE: All proxy locations use `set $upstream` for Docker DNS resolution.
    # When proxy_pass uses a variable, nginx does NOT strip the location prefix
    # from the URI. Explicit rewrite rules are required to map the /api/<service>/
    # prefix to the upstream path.

    # ── ADAPI Core ────────────────────────────────────────────────────────
    location /api/dynamicorch/ {
        set $upstream_dynamicorch http://dynamicorch-xacml:8083;
        rewrite ^/api/dynamicorch/(.*) /$1 break;
        proxy_pass $upstream_dynamicorch;
        proxy_http_version 1.1;
    }

    # ── Profile-CA + PIP ──────────────────────────────────────────────────
    location /api/profile-ca/ {
        set $upstream_ca http://profile-ca:8787;
        rewrite ^/api/profile-ca/(.*) /$1 break;
        proxy_pass $upstream_ca;
        proxy_http_version 1.1;
    }
    location /api/pip/ {
        set $upstream_pip http://profile-ca:8787;
        rewrite ^/api/pip/(.*) /pip/$1 break;
        proxy_pass $upstream_pip;
        proxy_http_version 1.1;
    }

    # ── PEP Services ──────────────────────────────────────────────────────
    location /api/kafka-authz/ {
        set $upstream_ka http://kafka-authz:9101;
        rewrite ^/api/kafka-authz/(.*) /$1 break;
        proxy_pass $upstream_ka;
        proxy_http_version 1.1;
    }
    location /api/topic-auth-xacml/ {
        set $upstream_ta http://topic-auth-xacml:9090;
        rewrite ^/api/topic-auth-xacml/(.*) /$1 break;
        proxy_pass $upstream_ta;
        proxy_http_version 1.1;
    }
    location /api/pki-rest-authz/ {
        set $upstream_pki http://pki-rest-authz:9209;
        rewrite ^/api/pki-rest-authz/(.*) /$1 break;
        proxy_pass $upstream_pki;
        proxy_http_version 1.1;
    }

    # ── Policy ────────────────────────────────────────────────────────────
    location /api/pap/ {
        set $upstream_pap http://pap:9505;
        rewrite ^/api/pap/(.*) /$1 break;
        proxy_pass $upstream_pap;
        proxy_http_version 1.1;
    }
    location /api/authzforce/ {
        set $upstream_az http://authzforce:8080;
        rewrite ^/api/authzforce/(.*) /authzforce-ce/$1 break;
        proxy_pass $upstream_az;
        proxy_http_version 1.1;
    }

    # ── Foundation ────────────────────────────────────────────────────────
    location /api/serviceregistry/ {
        set $upstream_sr https://serviceregistry:8490;
        rewrite ^/api/serviceregistry/(.*) /$1 break;
        proxy_pass $upstream_sr;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
    }
    location /api/authentication/ {
        set $upstream_auth https://authentication:8491;
        rewrite ^/api/authentication/(.*) /$1 break;
        proxy_pass $upstream_auth;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
    }
    location /api/consumerauth/ {
        set $upstream_cauth https://consumerauth:8492;
        rewrite ^/api/consumerauth/(.*) /$1 break;
        proxy_pass $upstream_cauth;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
    }
}
