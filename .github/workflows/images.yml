name: Images

# Builds the service images that downstream compose files pull, and pushes
# them to GHCR as ghcr.io/ulfbod/<name>:<tag> when a version tag is pushed.

on:
  push:
    tags: ["v*"]

jobs:
  image:
    name: Build and push ${{ matrix.name }}
    # Images are released from the public repository only.
    if: github.repository == 'ulfbod/Arrowhead-520-Go-Evol'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: serviceregistry
            context: foundation
            dockerfile: deploy/dockerfiles/foundation.Dockerfile
            build-args: CMD=serviceregistry
          - name: authentication
            context: foundation
            dockerfile: deploy/dockerfiles/foundation.Dockerfile
            build-args: CMD=authentication
          - name: consumerauth
            context: foundation
            dockerfile: deploy/dockerfiles/foundation.Dockerfile
            build-args: CMD=consumerauth
          - name: dynamicorch-xacml
            context: .
            dockerfile: deploy/dockerfiles/dynamicorch-xacml.Dockerfile
            build-args: ""
          - name: profile-ca
            context: .
            dockerfile: deploy/dockerfiles/profile-ca.Dockerfile
            build-args: ""
          - name: cert-provisioner
            context: .
            dockerfile: deploy/dockerfiles/cert-provisioner.Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ghcr.io/ulfbod/${{ matrix.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
