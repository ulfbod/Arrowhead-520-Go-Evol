# Arrowhead 5.2.0 — six-service subset, ConsumerAuthorization mode
#
# The smallest stack that orchestrates with authorization: profile-ca,
# cert-provisioner, ServiceRegistry, Authentication, ConsumerAuthorization and
# dynamicorch-xacml with AUTH_BACKEND=consumerauth. No authz-pdp, AuthzForce,
# PAP, brokers or dashboard. These are the six services published as images
# (see "Published Images" in ARCHITECTURE.md).
#
#   docker compose -f deploy/docker-compose.consumerauth.yml up --build -d
#   cd tests/integration && go test -tags=integration -v -run TestConsumerAuthMode ./...
#   docker compose -f deploy/docker-compose.consumerauth.yml down -v
#
# It uses the same host ports as deploy/docker-compose.yml; run one at a time.
#
# Ports exposed to host:
#   profile-ca HTTP (+ PIP):      http://localhost:8787
#   profile-ca mTLS:              https://localhost:8788
#   ServiceRegistry TLS:          https://localhost:8490
#   Authentication TLS:           https://localhost:8491
#   ConsumerAuthorization TLS:    https://localhost:8492
#   DynamicOrch-XACML HTTP:       http://localhost:8083

name: arrowhead-consumerauth

services:

  profile-ca:
    build:
      context: ../
      dockerfile: deploy/dockerfiles/profile-ca.Dockerfile
    environment:
      PORT: "8787"
      TLS_PORT: "8788"
      GRPC_PORT: "8789"
      CA_KEY_FILE: "/data/ca.key"
    volumes:
      - profile-ca-data:/data
    ports:
      - "8787:8787"
      - "8788:8788"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  cert-provisioner:
    build:
      context: ../
      dockerfile: deploy/dockerfiles/cert-provisioner.Dockerfile
    environment:
      CA_URL: "http://profile-ca:8787"
      CERTS_DIR: "/certs"
    volumes:
      - certs:/certs
    depends_on:
      profile-ca:
        condition: service_healthy
    restart: "no"

  serviceregistry:
    build:
      context: ../foundation
      dockerfile: ../deploy/dockerfiles/foundation.Dockerfile
      args:
        CMD: serviceregistry
    environment:
      PORT: "8080"
      TLS_PORT: "8490"
      TLS_CERT_FILE: "/certs/serviceregistry.crt"
      TLS_KEY_FILE:  "/certs/serviceregistry.key"
      TLS_CA_FILE:   "/certs/ca.crt"
      DB_PATH: "/data/serviceregistry.db"
    ports:
      - "8490:8490"
    volumes:
      - certs:/certs:ro
      - serviceregistry-data:/data
    depends_on:
      cert-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentication:
    build:
      context: ../foundation
      dockerfile: ../deploy/dockerfiles/foundation.Dockerfile
      args:
        CMD: authentication
    environment:
      PORT: "8081"
      TLS_PORT: "8491"
      TLS_CERT_FILE: "/certs/authentication.crt"
      TLS_KEY_FILE:  "/certs/authentication.key"
      TLS_CA_FILE:   "/certs/ca.crt"
      DB_PATH: "/data/authentication.db"
    ports:
      - "8491:8491"
    volumes:
      - certs:/certs:ro
      - authentication-data:/data
    depends_on:
      cert-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumerauth:
    build:
      context: ../foundation
      dockerfile: ../deploy/dockerfiles/foundation.Dockerfile
      args:
        CMD: consumerauth
    environment:
      PORT: "8082"
      TLS_PORT: "8492"
      TLS_CERT_FILE: "/certs/consumerauth.crt"
      TLS_KEY_FILE:  "/certs/consumerauth.key"
      TLS_CA_FILE:   "/certs/ca.crt"
      DB_PATH: "/data/consumerauth.db"
    ports:
      - "8492:8492"
    volumes:
      - certs:/certs:ro
      - consumerauth-data:/data
    depends_on:
      cert-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamicorch-xacml:
    build:
      context: ../
      dockerfile: deploy/dockerfiles/dynamicorch-xacml.Dockerfile
    environment:
      SR_URL: "http://serviceregistry:8080"
      AUTH_BACKEND: "consumerauth"
      CA_URL: "http://consumerauth:8082"
      ENABLE_AUTH: "true"
      PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      serviceregistry:
        condition: service_healthy
      consumerauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  certs:
  profile-ca-data:
  serviceregistry-data:
  authentication-data:
  consumerauth-data:
